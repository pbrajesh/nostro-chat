name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug

      # Real relays can be slow or down, so this never blocks the APK.
      - name: Relay smoke test (sends a real encrypted DM)
        continue-on-error: true
        env:
          RELAY_SMOKE_TEST: "1"
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test --tests '*Live*' --rerun-tasks -i \
            | grep -E "conn |got from|wss://|reports from|monitors:|picked|Live|FAILED|BUILD"

      - uses: actions/upload-artifact@v4
        with:
          name: nostr-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
